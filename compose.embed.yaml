# CPU-only embeddings sidecar — an OVERLAY, not part of the base stack.
#
#   docker compose -f compose.yaml -f compose.embed.yaml up -d
#
# Reproduces the live `embed` service recorded in docs/deployment.md
# ("Release ea57c83 — 2026-09-17 afternoon") and flagged as a gap in
# docs/spec-service-boundaries.md §2 and §7 finding 8: "The `embed` service
# is defined only in the live override, so the repo cannot reproduce the
# live stack." It is a second, CPU-only llama.cpp server dedicated to
# embeddings, so retrieval and tool-routing calls never evict the chat model
# from the GPU-backed `llama` service (compose.llamacpp.yaml).
#
# `EMBEDDING_BASE_URL` is the only switch web reads (apps/web/server/rag.cjs):
# point it at this service to use it; leave it unset to embed against the
# main inference endpoint instead. Per docs/spec-service-boundaries.md §2,
# this service was `default`-network only. It now also joins `models` so the
# model loader (which is on `models` only, because it holds the Docker socket
# and must not be on `default`) can reach it for the status probe (issue #549).
# Joining `models` exposes embed to llama/web/model-loader only; the reverse
# (putting model-loader on `default`) would expose the socket holder to Diary.
#
# The live embed image's tag/digest is not recorded, so this overlay pins the
# `embed` service to the SAME image digest as compose.llamacpp.yaml's `llama`
# service (the `server-vulkan` build) — the only llama.cpp digest this repo
# has on record — and relies on `--device none` to run it CPU-only. This is
# openly the same image as llama by design, not the plain `server` variant.
#
# Several fields are not fully recorded in docs/deployment.md. Each is
# marked "[live: verify]" below with the safest value chosen in its place;
# see the PR body for the full list to confirm against the live box.

services:
  embed:
    # Live notes say only "pinned llama.cpp image" (no tag/digest recorded), and
    # no plain `server`-tag digest is recorded anywhere in this repo to pin
    # against. Rather than invent one, this reuses compose.llamacpp.yaml's
    # `server-vulkan` digest — the only pinned llama.cpp digest this repo has
    # on record — and relies on `--device none` below to keep this instance
    # CPU-only. # same image as llama by design [live: verify] confirm the
    # live embed image's actual tag/digest; it may not match this one.
    # #1668: EMBED_IMAGE moves the embedding service to another llama.cpp build (EmbeddingGemma 2
    # needs one with `gemma-embedding2`, #1636); the default is the digest recorded above.
    image: ${EMBED_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-vulkan-b11610@sha256:d64043576ad8fb29170563c769a997dbc1b9928f0d4a127fb9e4a9706ccb475b} # live since 2026-10-14 (b11610, same digest as llama; docs/changelog.md)
    restart: unless-stopped # [live: verify] restart policy is not recorded in deployment.md
    # #1668: settings-driven. This is a llama.cpp ROUTER that serves exactly the models listed in
    # /config/embedding.ini, a file only the model manager writes (noevia-rs noevia-model-manager,
    # /api/v1/embedding-service) from the admin's choice on the Models page. EMBEDDING_MODEL +
    # EMBED_MODEL_FILE below seed that choice on first start only; afterwards the saved choice wins.
    # Normally one model; two while a switch re-indexes (the active one keeps serving search); none
    # when embedding is off, and then the model manager stops this container. The flags after the
    # preset are the defaults every model here gets: CPU only (`--device none`, so it never
    # competes with the chat engine for GPU memory and no chat load can evict it), embeddings,
    # mean pooling (#697: same as the live nomic section, so stored vectors stay comparable).
    command:
      - "--models-preset"
      - "/config/embedding.ini"
      - "--models-max"
      - "2"
      - "--device"
      - "none"
      - "--embedding"
      - "--pooling"
      - "mean"
      - "-c"
      - "4096"
      - "-b"
      - "2048"
      - "-ub"
      - "2048"
      - "--parallel"
      - "2"
      - "-t"
      - "4"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
    volumes:
      # [live: verify] deployment.md does not record whether embed shares
      # LLAMACPP_MODELS_DIR or has its own folder; sharing is the safest
      # default since it needs no extra operator-provided variable.
      - ${LLAMACPP_MODELS_DIR:?Set the existing public models directory}:/models:ro
      # #1668: read-only; the model manager (which mounts it read-write) owns embedding.ini here.
      - ${LLAMACPP_CONFIG_DIR:?Set the llama.cpp config directory}:/config:ro
    # The model manager renders embedding.ini before it reports healthy, so a fresh start never
    # shows the router a missing preset.
    depends_on:
      model-loader:
        condition: service_healthy
    # Two models are loaded at once only during a switch. nomic (Q8_0) needs ~0.3 GiB; EmbeddingGemma
    # 2 on an image without llama.cpp #30255 needs ~3 GiB at -ub 2048 (#1636): raise this first.
    # #1726: with NOEVIA_MULTIMODAL_RAG on, embedding images loads `<model>.vision` beside the text
    # model: a second copy of the weights plus the projector (EmbeddingGemma 2 mmproj ~0.55 GiB F16).
    # Raise this before turning it on; web pauses image embedding while a switch holds two models.
    mem_limit: ${EMBED_MEMORY_LIMIT:-1g}
    memswap_limit: ${EMBED_MEMORY_LIMIT:-1g} # [live: verify] not recorded in deployment.md; set equal to mem_limit to disable swap
    cpus: ${EMBED_CPUS:-1.0}  # [live: verify] not recorded; chosen to leave headroom next to docling/ocr
    healthcheck:
      # Path is recorded ("healthcheck `/health`"); the exact runner inside
      # the llama.cpp image is not. The upstream llama.cpp server image ships
      # curl (and its own HEALTHCHECK uses curl), not wget, so this uses curl
      # to match. [live: verify] interval/timeout/retries below are not
      # recorded; chosen to match the other services' healthchecks.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [default, models]
    # No published ports: web (and, if ever pointed at it, diary) reach it
    # only over the default network, matching docs/spec-service-boundaries.md §2.
    # [live: verify] whether the live `default` network here is this project's
    # own default or the external `lemonade_default` network (docs/deployment.md).

  # #1668: with this overlay the model manager (compose.llamacpp.yaml) runs the embedding service.
  # It may restart or stop EMBED_CONTAINER and nothing else (its only Docker write path).
  model-loader:
    environment:
      EMBED_CONTAINER: ${EMBED_CONTAINER:-cowork-embed-1}
      EMBED_URL: http://embed:8080
      EMBED_PRESET_PATH: /config/embedding.ini
      # Seeds, read once when no saved choice exists (DATA_DIR/embedding-service.json).
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBED_MODEL_FILE: ${EMBED_MODEL_FILE:-}
      # #1726: with multimodal RAG on, a served model with one mmproj*.gguf beside it also gets a
      # `<model>.vision` preset, loaded only while images are embedded. Same switch as web.
      NOEVIA_MULTIMODAL_RAG: ${NOEVIA_MULTIMODAL_RAG:-0}

  # #1636: EmbeddingGemma 2 (google/embeddinggemma-2, Apache-2.0; GGUF ggml-org/embeddinggemma-2-GGUF)
  # as a SECOND CPU embeddings server. #1668: superseded for switching by the settings-driven `embed`
  # above (it serves the next model beside the active one); kept for a manual parity run against a
  # separate image. As before, so every index can be re-embedded while `embed` (nomic) keeps
  # serving search. Off unless the `embed-next` profile is enabled:
  #
  #   docker compose -f compose.yaml -f compose.embed.yaml --profile embed-next up -d embed-next
  #
  # then point the re-index at it (EMBEDDING_NEXT_MODEL=embeddinggemma-2,
  # EMBEDDING_NEXT_PROFILE=embeddinggemma-2, EMBEDDING_NEXT_BASE_URL=http://embed-next:8080/v1, or
  # POST /api/embedding set-next). After the switch it serves search; `embed` stays for rollback
  # until `finish`. Nothing here is started, pulled or downloaded by default.
  #
  # Image: the architecture (`gemma-embedding2`) is in llama.cpp from b11452 (#30054, merged
  # 2026-10-06); the first published server-vulkan image with it is b11459. The default below is
  # b11580 (2026-10-13), which also has #30416. Neither has #30255/#30445 (merged 2026-10-13): until
  # then llama-server keeps a logits buffer of vocabulary (262,144) x batch tokens for this model,
  # about 1 MiB per token of `-ub`, which is why the default memory limit is 3g at -ub 2048. With a
  # later image that has #30255, 1536m is enough (Q8_0 weights 0.29 GiB plus compute).
  # The model's own context is 8,192 tokens; one input must fit one ubatch (non-causal model).
  embed-next:
    profiles: [embed-next]
    image: ${EMBED_NEXT_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-vulkan-b11580@sha256:ee2ecb9c3a4d6fa00b918b133fd7a2828195593688eeaef6e6516ef833f88f09}
    restart: unless-stopped
    command:
      - "--device"
      - "none"
      - "--embedding"
      - "--pooling"
      - "mean"    # also the GGUF's own pooling_type (1 = mean); the model card says mean pooling
      - "--model"
      # A file under the models folder; noevia never keys anything off this name, only off the alias.
      - "/models/${EMBED_NEXT_MODEL_FILE:-embeddinggemma-2/embeddinggemma-2-Q8_0.gguf}"
      - "--alias"
      - "${EMBED_NEXT_ALIAS:-embeddinggemma-2}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      # Two slots of 2048 tokens, like `embed`: a chunk up to 2048 tokens fits one ubatch. Raise
      # -c/-b/-ub together (up to 2 x 8192) only with an image that has #30255.
      - "-c"
      - "${EMBED_NEXT_CTX:-4096}"
      - "-b"
      - "${EMBED_NEXT_UBATCH:-2048}"
      - "-ub"
      - "${EMBED_NEXT_UBATCH:-2048}"
      - "--parallel"
      - "2"
      - "-t"
      - "${EMBED_NEXT_THREADS:-4}"
    volumes:
      - ${LLAMACPP_MODELS_DIR:?Set the existing public models directory}:/models:ro
    mem_limit: ${EMBED_NEXT_MEMORY_LIMIT:-3g}
    memswap_limit: ${EMBED_NEXT_MEMORY_LIMIT:-3g}
    cpus: ${EMBED_NEXT_CPUS:-4}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks: [default, models]

  web:
    environment:
      EMBEDDING_BASE_URL: http://embed:8080/v1
      # #1668: the settings-driven embedding service's one address (projects and the Diary alike).
      EMBEDDING_SERVICE_URL: http://embed:8080/v1
    depends_on:
      # [live: verify] deployment.md does not record the live depends_on
      # condition; service_started is used here so a healthcheck runner
      # mismatch on the live box cannot block web from starting at all.
      embed:
        condition: service_started

  # #697: Diary embeds here too. On the shared engine an embedding request would evict the chat
  # model (one model at a time); LLM_EMBED_BASE_URL sends Diary's embeddings to this sidecar.
  diary:
    environment:
      LLM_EMBED_BASE_URL: http://embed:8080/v1

networks:
  # Also declared by compose.llamacpp.yaml; the merge is idempotent. Declared here so
  # this overlay still validates when used without the llama.cpp overlay.
  models: {}
