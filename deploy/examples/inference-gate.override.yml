# noevia#2115: the inference gate on a separate inference machine (docs/deployment.md "Inference
# gate"). Use it with that machine's own Compose files, where the chat router is the `llama` service
# on a `models` network and publishes the address web and Diary use for it:
#   docker compose -f <the machine's Compose files> -f inference-gate.override.yml config --quiet
# The gate takes over that address (INFERENCE_GATE_PUBLISH), so web and Diary need no change; the
# router keeps no host port and is reachable only on `models` (through the gate, and by the model
# manager for presets). Keep the previous Compose files for rollback.
services:
  llama:
    ports: !reset []

  inference-gate:
    # The model manager image built for this release ships the gate (noevia-services, PR 2 of #2115).
    image: cowork-model-loader:${MODEL_MANAGER_VERSION:?Set MODEL_MANAGER_VERSION to the model manager image tag that ships the gate}
    pull_policy: never
    restart: unless-stopped
    command: ["noevia-inference-gate"]
    environment:
      # Blank values take the gate's defaults; an invalid value stops it before it listens.
      GATE_UPSTREAM: http://llama:8080
      GATE_ADMIN_TOKEN: ${INFERENCE_GATE_ADMIN_TOKEN:-}
      GATE_CHAT_SLOTS: ${GATE_CHAT_SLOTS:-}
      GATE_EXEMPT_MODELS: ${GATE_EXEMPT_MODELS:-}
      GATE_MAX_WAIT_SECONDS: ${GATE_MAX_WAIT_SECONDS:-}
      GATE_FAIR_HOLD_SECONDS: ${GATE_FAIR_HOLD_SECONDS:-}
      GATE_RESIDENCY_GRACE_SECONDS: ${GATE_RESIDENCY_GRACE_SECONDS:-}
      GATE_LEASE_IDLE_SECONDS: ${GATE_LEASE_IDLE_SECONDS:-}
      GATE_LEASE_HARD_SECONDS: ${GATE_LEASE_HARD_SECONDS:-}
      GATE_UNLOAD_TIMEOUT_SECONDS: ${GATE_UNLOAD_TIMEOUT_SECONDS:-}
      GATE_ROUTER_DOWN_GRACE_SECONDS: ${GATE_ROUTER_DOWN_GRACE_SECONDS:-}
      GATE_SESSION_HOLD_SECONDS: ${GATE_SESSION_HOLD_SECONDS:-}
      GATE_MAX_WAITERS: ${GATE_MAX_WAITERS:-}
      GATE_MAX_LEASES: ${GATE_MAX_LEASES:-}
      GATE_MAX_BODY_BYTES: ${GATE_MAX_BODY_BYTES:-}
      GATE_MAX_BUFFERED_BYTES: ${GATE_MAX_BUFFERED_BYTES:-}
      GATE_BODY_TIMEOUT_SECONDS: ${GATE_BODY_TIMEOUT_SECONDS:-}
      GATE_UPSTREAM_HEADER_TIMEOUT_SECONDS: ${GATE_UPSTREAM_HEADER_TIMEOUT_SECONDS:-}
      GATE_HEADER_READ_TIMEOUT_SECONDS: ${GATE_HEADER_READ_TIMEOUT_SECONDS:-}
      GATE_MAX_CONNECTIONS: ${GATE_MAX_CONNECTIONS:-}
    read_only: true
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Request bodies are buffered up to GATE_MAX_BUFFERED_BYTES (default 256 MiB) in total.
    mem_limit: 512m
    pids_limit: 256
    # The image's own healthcheck probes the model manager; this one asks the gate.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /gate/v1/health HTTP/1.0\\r\\nHost: gate\\r\\n\\r\\n' >&3 && timeout 4 head -n 1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # The address and port web and Diary already use for the router (address:port). Restrict who
    # may reach it on the host firewall (docs/deployment.md, noevia#2122).
    ports:
      - "${INFERENCE_GATE_PUBLISH:?Set INFERENCE_GATE_PUBLISH to the address:port web and Diary use for the router}:8080"
    networks: [models]
