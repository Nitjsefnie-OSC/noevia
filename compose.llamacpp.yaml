# Optional direct native-router overlay; this does not modify a running deployment.
# docker compose -f compose.yaml -f compose.llamacpp.yaml config --quiet
# Mount DIRECTORY paths so atomic preset renames reach both services.
services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b11610@sha256:d64043576ad8fb29170563c769a997dbc1b9928f0d4a127fb9e4a9706ccb475b
    restart: unless-stopped
    # #697: `--models-max 1` — one resident model. On a shared-memory GPU (AMD APU) weights and KV
    # live in GTT, system RAM this container's mem_limit does not count; two large models plus
    # their prompt caches livelocked DaServer. Embeddings and the reranker run as their own CPU
    # sidecars (compose.embed.yaml, compose.rerank.yaml), never in this engine.
    command: ["--models-preset", "/config/models.ini", "--host", "0.0.0.0", "--port", "8080", "--models-max", "1", "--metrics"]
    devices:
      - ${LLAMACPP_RENDER_DEVICE:?Set the qualified render device}:${LLAMACPP_RENDER_DEVICE}
      - ${LLAMACPP_CARD_DEVICE:?Set the qualified card device}:${LLAMACPP_CARD_DEVICE}
    volumes:
      - ${LLAMACPP_MODELS_DIR:?Set the existing public models directory}:/models:ro
      - ${LLAMACPP_CONFIG_DIR:?Set the qualified preset directory}:/config:ro
      - ${LLAMACPP_CACHE_DIR:?Set a dedicated writable native cache}:/cache
    environment:
      LLAMA_CACHE: /cache
    mem_limit: ${LLAMACPP_MEMORY_LIMIT:-14g}
    memswap_limit: ${LLAMACPP_MEMORY_LIMIT:-14g}
    # Default for web and Diary inference; models so the model manager can reach it.
    networks: [default, models]
    # No published ports; model administration stays on the Compose network.
  # Model manager (Model Loader by scratchhax, MIT, folded into services/model-manager):
  # downloads, the models.ini editor, autoconfig, telemetry, benchmarks and backend
  # restarts. It has no login and holds the Docker socket, so it publishes no port;
  # noevia's Settings → Models & routing drives its JSON API for administrators.
  model-loader:
    build:
      context: ${COWORK_SOURCE_DIR:-..}/services/model-manager
    image: cowork-model-loader:${MODEL_MANAGER_VERSION:?Set MODEL_MANAGER_VERSION to the built model manager image tag}
    restart: unless-stopped
    environment:
      MODELS_DIR: /models
      MODELS_HOST_PATH: ${LLAMACPP_MODELS_DIR}
      MODELS_INI_PATH: /config/models.ini
      DATA_DIR: /data
      LLAMA_CONTAINERS: ${MODEL_LOADER_LLAMA_CONTAINERS:-}
      GPU_VRAM: ${MODEL_LOADER_GPU_VRAM:-}
      HOST_RAM_RESERVE_GB: ${MODEL_LOADER_HOST_RAM_RESERVE_GB:-8}
      # #697: prompt-cache (--cache-ram, MiB) cap written by autoconfig and new sections, and the
      # hard maximum any saved value is clamped to.
      LLAMACPP_AUTOCONFIG_CACHE_RAM_MAX_MIB: ${LLAMACPP_AUTOCONFIG_CACHE_RAM_MAX_MIB:-1024}
      LLAMACPP_CACHE_RAM_HARD_MAX_MIB: ${LLAMACPP_CACHE_RAM_HARD_MAX_MIB:-2048}
      # Required: this service holds the Docker socket; only web knows this secret.
      MODEL_LOADER_TOKEN: ${MODEL_LOADER_TOKEN:?Set a random MODEL_LOADER_TOKEN (e.g. openssl rand -hex 32)}
      # #1689/#1717: the model manager's front. python (default) runs uvicorn; rust runs
      # noevia-model-manager in front of it (needed for /api/v1/embedding-service, #1668).
      MODEL_MANAGER_IMPL: ${MODEL_MANAGER_IMPL:-python}
      # #1318: native read-only GET /api/v1/settings. python (default) keeps Python serving it; rust needs
      # MODEL_MANAGER_IMPL=rust too. PUT always stays Python (single writer). Never pass an empty value.
      MODEL_MANAGER_SETTINGS_IMPL: ${MODEL_MANAGER_SETTINGS_IMPL:-python}
      # #1318: native read-only GET /api/v1/models/updates, same rules; every update-check writer stays Python.
      MODEL_MANAGER_MODEL_UPDATES_IMPL: ${MODEL_MANAGER_MODEL_UPDATES_IMPL:-python}
      # #1318: native read-only GET /api/v1/models/detail, same rules, and rust also needs TZ=UTC in this
      # service. loadedOn and fit always come from the Python app (the native front asks it for them).
      MODEL_MANAGER_MODEL_DETAIL_IMPL: ${MODEL_MANAGER_MODEL_DETAIL_IMPL:-python}
      # #1318: native read-only GET /api/v1/download-targets, same rules; POST /api/v1/downloads stays Python.
      MODEL_MANAGER_DOWNLOAD_TARGETS_IMPL: ${MODEL_MANAGER_DOWNLOAD_TARGETS_IMPL:-python}
      # #1318: native PUT/DELETE /api/v1/badges, same rules; badge reads stay Python.
      MODEL_MANAGER_BADGES_IMPL: ${MODEL_MANAGER_BADGES_IMPL:-python}
      # #1318: native GET /api/v1/benchmark/runs/{id}, same rules; live chart values stay Python.
      MODEL_MANAGER_BENCH_RUNS_IMPL: ${MODEL_MANAGER_BENCH_RUNS_IMPL:-python}
      # #1318: native models.ini writers (all five together), same rules; rust also needs TZ unset or UTC.
      MODEL_MANAGER_SECTION_WRITES_IMPL: ${MODEL_MANAGER_SECTION_WRITES_IMPL:-python}
      # #1318: native PUT /api/v1/settings (the HF token), same rules; the token test stays Python.
      MODEL_MANAGER_SETTINGS_WRITE_IMPL: ${MODEL_MANAGER_SETTINGS_WRITE_IMPL:-python}
      # #1318: native backend restart/test, same rules; restart errors stay recorded in Python.
      MODEL_MANAGER_BACKEND_CONTROL_IMPL: ${MODEL_MANAGER_BACKEND_CONTROL_IMPL:-python}
      # #1318: native GET /api/v1/benchmark, same rules; the benchmark runner stays in Python.
      MODEL_MANAGER_BENCHMARK_OVERVIEW_IMPL: ${MODEL_MANAGER_BENCHMARK_OVERVIEW_IMPL:-python}
      # #1747: idle chat models unload themselves (llama.cpp sleep-idle-seconds in models.ini [*]).
      # Blank = 900 s (15 min); 0 disables. The chat router only; embedding.ini and Laya are untouched.
      CHAT_MODEL_IDLE_UNLOAD_SECONDS: ${CHAT_MODEL_IDLE_UNLOAD_SECONDS:-}
    volumes:
      - ${LLAMACPP_MODELS_DIR}:/models
      - ${LLAMACPP_CONFIG_DIR}:/config
      - ${MODEL_LOADER_DATA_DIR:?Set a writable Model Loader data directory}:/data
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 512m
    # Not on the default network: the Diary sidecar must not reach a Docker-socket holder.
    networks: [models]

  web:
    networks: [models]
    environment:
      INFERENCE_BASE_URL: http://llama:8080/v1
      MODEL_MANAGER_KIND: llamacpp
      MODEL_MANAGER_BASE_URL: http://llama:8080
      LLAMACPP_PRESET_PATH: /llamacpp-config/models.ini
      EMBEDDING_MODEL: ${LLAMACPP_EMBED_MODEL:?Set an installed native embedding identity}
      # #1636: how text is framed for that identity: nomic-v1 (default, unchanged text) or
      # embeddinggemma-2 (the model card's task prompts). Vectors are stored per (profile, model), so
      # change both only through a re-index (web /api/embedding, or EMBEDDING_NEXT_* below), never here.
      EMBEDDING_PROFILE: ${LLAMACPP_EMBED_PROFILE:-${EMBEDDING_PROFILE:-nomic-v1}}
      # Preset suggestions read model file headers read-only and size against this limit.
      LLAMACPP_MODELS_PATH: /models
      LLAMACPP_MEMORY_LIMIT: ${LLAMACPP_MEMORY_LIMIT:-14g}
      LLAMACPP_CACHE_PATH: /cache
      # Calibration stops a step when host available memory falls below this.
      LLAMACPP_CALIBRATION_MEMORY_FLOOR_GIB: ${LLAMACPP_CALIBRATION_MEMORY_FLOOR_GIB:-4}
      # #697: one model at a time (llama `--models-max 1` above) within an inference memory budget.
      # INFERENCE_MEMORY_BUDGET_GIB is only the initial value; administrators change it under
      # Settings → Models & routing. Loads whose estimate exceeds it are refused.
      INFERENCE_MEMORY_BUDGET_GIB: ${INFERENCE_MEMORY_BUDGET_GIB:-16}
      LLAMACPP_AUTOCONFIG_CACHE_RAM_MAX_MIB: ${LLAMACPP_AUTOCONFIG_CACHE_RAM_MAX_MIB:-1024}
      LLAMACPP_CACHE_RAM_HARD_MAX_MIB: ${LLAMACPP_CACHE_RAM_HARD_MAX_MIB:-2048}
      # Runtime safety net: unload when GPU memory in use (sysfs GTT + VRAM, read-only from the
      # container's /sys) plus the engine container's memory stays above the budget by more than
      # the overshoot. INFERENCE_GTT_USED_PATH pins the GPU's counter(s); unset reads every card.
      INFERENCE_BUDGET_WATCH: ${INFERENCE_BUDGET_WATCH:-on}
      INFERENCE_BUDGET_WATCH_INTERVAL_MS: ${INFERENCE_BUDGET_WATCH_INTERVAL_MS:-15000}
      INFERENCE_BUDGET_OVERSHOOT_PCT: ${INFERENCE_BUDGET_OVERSHOOT_PCT:-10}
      INFERENCE_GTT_USED_PATH: ${INFERENCE_GTT_USED_PATH:-}
      # Only this container's anonymous memory counts (embed/rerank share the image). Blank: llama.
      INFERENCE_ENGINE_CONTAINER: ${INFERENCE_ENGINE_CONTAINER:-}
      MODEL_LOADER_URL: http://model-loader:8090
      MODEL_LOADER_TOKEN: ${MODEL_LOADER_TOKEN}
      # Who writes models.ini: model-loader (default, the single writer, #295/#269) or web.
      # Rollback to web: set MODELS_INI_WRITER=web AND drop :ro below, then recreate web.
      MODELS_INI_WRITER: ${MODELS_INI_WRITER:-model-loader}
    volumes:
      # Read-only: web only reads models.ini; model-loader writes it through PUT /api/v1/models-ini.
      - ${LLAMACPP_CONFIG_DIR}:/llamacpp-config:ro
      - ${LLAMACPP_MODELS_DIR}:/models:ro
      - ${LLAMACPP_CACHE_DIR}:/cache:ro
  diary:
    environment:
      LLM_BASE_URL: http://llama:8080/v1
      LLM_CHAT_MODEL: ${LLAMACPP_CHAT_MODEL:?Set an installed native chat identity}
      LLM_EMBED_MODEL: ${LLAMACPP_EMBED_MODEL}
      # #1636: the identity's prompt framing (nomic-v1 | embeddinggemma-2); the same value as web's.
      LLM_EMBED_PROFILE: ${LLAMACPP_EMBED_PROFILE:-${EMBEDDING_PROFILE:-nomic-v1}}
      LLM_AUX_BASE_URL: http://llama:8080/v1
      LLM_AUX_MODEL: ${LLAMACPP_AUX_MODEL:?Set an installed native auxiliary identity}

networks:
  # Web, the engine and the model manager only. The Diary sidecar is not attached.
  models: {}
